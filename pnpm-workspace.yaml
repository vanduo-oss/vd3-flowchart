# pnpm settings live here (pnpm 10+ no longer reads the package.json "pnpm" field).
onlyBuiltDependencies:
  - esbuild
  - "@playwright/test"

# Security: braces (via stylelint > micromatch) has no patched release yet
# (GHSA-vfj7-8cjw-p6xm / CVE-2026-93687). Dev-only transitive; keep the
# exception narrow until upstream ships a fix.
auditConfig:
  ignoreCves:
    - CVE-2026-93687

overrides:
  # Security: force transitive brace-expansion (minimatch via eslint /
  # typescript-eslint / @vue/test-utils) to a patched release —
  # GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p, GHSA-q2hr-2g5m-vwhr.
  # Dev-only (never shipped in dist); keeps
  # `pnpm audit --audit-level=moderate` green.
  "brace-expansion": "5.0.12"

  # Security: force transitive fast-uri (stylelint > table > ajv) to a
  # patched release — GHSA-hrr3-gc8f-f4qj (host case normalization).
  # Dev-only; keeps `pnpm audit --audit-level=moderate` green.
  "fast-uri@>=3.0.0 <3.1.8": "^3.1.8"

  # Security: force transitive nanoid (stylelint > postcss) to a patched
  # release — GHSA-2v37-7h3g-55p8. Dev-only; keeps audit green.
  "nanoid@<3.3.18": "^3.3.18"
